name: calculator
description: "A lightweight and responsive calculator application by Bitmint Lab."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#101214"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#101214"
  image: assets/branding/splash_logo.png
  color_dark: "#101214"
  image_dark: assets/branding/splash_logo.png
  android: true
  ios: false
  web: false
  fullscreen: true

  android_12:
    color: "#101214"
    image: assets/branding/splash_logo.png
    icon_background_color: "#101214"